# The unified view (after Sutton & Barto, Figure 8.11): where each algorithm sits.
# [width, depth]: width 0 = sample updates, 1 = expected updates; depth 0 = one step (bootstrapping), 1 = the full return.
# Sample methods keep a column per line (tables, planning, approximation, policy gradients, continuous control),
# so the colors stay together; methods that share a spot are stacked a little apart so their names stay readable.
# Depth -1 is the bandit strip above the plane: with no next state, one step is already the whole return.
[unified]
epsilon-greedy = [0.02, -1]
optimistic-init = [0.15, -1]
ucb = [0.29, -1]
gradient-bandit = [0.39, -1]
td0 = [0.02, 0.06]
sarsa = [0.02, 0.11]
q-learning = [0.02, 0.16]
double-q = [0.02, 0.21]
dyna-q = [0.165, 0.06]
dyna-q-plus = [0.165, 0.11]
prioritized-sweeping = [0.165, 0.16]
semi-gradient-td = [0.315, 0.06]
semi-gradient-sarsa = [0.315, 0.11]
dqn = [0.315, 0.16]
dqn-extensions = [0.315, 0.21]
actor-critic = [0.475, 0.06]
ddpg = [0.6, 0.06]
td3 = [0.6, 0.11]
sac = [0.6, 0.16]
expected-sarsa = [0.73, 0.11]
policy-evaluation = [0.865, 0.06]
policy-iteration = [0.865, 0.11]
value-iteration = [0.865, 0.16]
n-step-td = [0.02, 0.43]
n-step-sarsa = [0.02, 0.48]
a2c = [0.475, 0.43]
